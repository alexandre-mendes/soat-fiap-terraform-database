name: Terraform Apply - DynamoDB

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
env:
  AWS_REGION: us-east-1
  CLUSTER_NAME: soat-cluster

jobs:
  terraform:
    name: Apply Terraform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Configurar AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Update Kubeconfig
        run: |
          aws eks update-kubeconfig \
          --name $CLUSTER_NAME \
          --region $AWS_REGION

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.0

      - name: Inicializar Terraform
        run: terraform init

      - name: Validar Terraform
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Aplicar Terraform (sem prompt)
        run: terraform apply -auto-approve

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Get Aurora DB Credentials from Secrets Manager
        id: get_aurora_secret
        run: |
          # Obtenha o SecretString completo do Secrets Manager
          DB_SECRET_JSON=$(aws secretsmanager get-secret-value --secret-id soat-aurora-db-credentials --query SecretString --output text)
          
          # Parse o JSON para extrair os valores individuais
          DB_HOST=$(echo "$DB_SECRET_JSON" | jq -r '.host')
          DB_USERNAME=$(echo "$DB_SECRET_JSON" | jq -r '.username')
          DB_PASSWORD=$(echo "$DB_SECRET_JSON" | jq -r '.password')
          DB_DATABASE=$(echo "$DB_SECRET_JSON" | jq -r '.database')
          DB_PORT=$(echo "$DB_SECRET_JSON" | jq -r '.port')

          # Exponha as variáveis para os próximos passos
          echo "DB_HOST=$DB_HOST" >> $GITHUB_ENV
          echo "DB_USERNAME=$DB_USERNAME" >> $GITHUB_ENV
          echo "DB_PASSWORD=$DB_PASSWORD" >> $GITHUB_ENV
          echo "DB_DATABASE=$DB_DATABASE" >> $GITHUB_ENV
          echo "DB_PORT=$DB_PORT" >> $GITHUB_ENV
        env:
      
      - name: Create Kubernetes Secret with Aurora DB credentials
        run: |
          kubectl create secret generic aurora-db-credentials \
            --from-literal=DB_HOST=$DB_HOST \
            --from-literal=DB_USERNAME=$DB_USERNAME \
            --from-literal=DB_PASSWORD=$DB_PASSWORD \
            --from-literal=DB_DATABASE=$DB_DATABASE \
            --from-literal=DB_PORT=$DB_PORT \
            --dry-run=client -o yaml | kubectl apply -f -